<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="login.css">
</head>
<body>
    <div class="login-background">
        <div class="bigcontainer">    
            <div class="container">
                <div class="nev">Login</div>
             <div class="p">
                    <div class="name" >Username:</div>
                    <div class="box" ><input type="text" placeholder="Enter your name" ></div>
                </div>
               <div class="p">
                   <div class="name">ID:</div>
                   <div class="box" ><input type="text" placeholder="Enter your ID" id="a"></div>
                </div>
                <div class="p">
                   <div class="name">Role:</div>
                    <div class="box" >
                        <select id="a" >
                            <option hidden value="">Select Your Role</option>
                            <option value="student">Student</option>
                            <option value="teacher">Teacher</option>
                            <option value="admin">Admin</option>
                        </select>
                 </div>
             </div>
              <div class="p">
                  <div class="name">Email:</div>
                  <div class="box" ><input type="text" placeholder="Enter your student email" id="a"></div>
              </div>
              <div class="p">
                  <div class="name">Password:</div>
                  <div class="box" ><input type="password" placeholder="Enter your password" id="a"></div>
             </div>
             <div class="fr">
                    <div class="ck"> <input type="checkbox">Remember me</div>
                    <div class="for"><a href="#">Forgot Password?</a></div>  
             </div>
             <button type="submit" class="btn">Login</button>
              <div class="register">Don't have an account? <a href="#">Register</a></div>
            </div>
        </div>
    </div>
</body>
</html>
